# Publishes to GitHub Pages (thorstein-games.github.io/pixels), which
# thorstein-games-website proxies at thorsteingames.com/pix-pen.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let a deploy that has started finish; a newer push queues behind it.
  cancel-in-progress: false

jobs:
  # The full CI suite gates every deploy: if it fails, nothing is published.
  test:
    uses: ./.github/workflows/ci.yml

  # Built alongside the tests so the deploy itself only has to publish.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
