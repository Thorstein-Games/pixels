# Typecheck + unit tests, and the Playwright suite in desktop Chrome, Android
# Chrome and iPhone Safari, all in parallel. Runs on every push to a branch
# other than main; Deploy calls it before every deploy of main, so a red run
# never ships.
name: CI

on:
  push:
    branches-ignore: [main]
  workflow_call:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  e2e:
    runs-on: ubuntu-latest
    # Browsers and their system libraries come preinstalled, which saves the
    # ~7 minute `playwright install --with-deps`. Keep the tag in step with
    # @playwright/test in package.json (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone, iphone]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright version matches the container
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          test "$v" = "1.56.1" || { echo "package has Playwright $v; update the container tag in ci.yml"; exit 1; }
      - run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: "1"
      # The page snapshot at each failure, readable straight from the log.
      - name: Show failure context
        if: failure()
        run: find test-results -name error-context.md -exec sh -c 'echo "=== $1"; cat "$1"' _ {} \;
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          retention-days: 7
